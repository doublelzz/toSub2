<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference = "system";
        try { preference = localStorage.getItem("tosub2.theme") || "system"; } catch {}
        if (!["system", "light", "dark"].includes(preference)) preference = "system";
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference;
      })();
    </script>
    <title>ChatGPT 账号授权控制台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
